[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-explorer"
version = "1.0.0"
description = "Explore, plot and classify the Iris dataset with a k-NN written from scratch"
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
iris-explorer = "iris_explorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
